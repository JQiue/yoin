[package]
name = "yoin"
version = "0.0.1"
edition = "2024"
publish = false

[workspace]
members = [".", "migration"]

[workspace.dependencies]
migration = { path = "migration" }
dotenvy = "0.15.7"
sea-orm = "2.0.0-rc"
sea-orm-migration = { version = "2.0.0-rc" }
tokio = "1.48.0"
serde = "1.0.228"
envy = "0.4.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
axum = "0.8.8"
serde_json = "1.0.148"
thiserror = "2.0.17"
tower = "0.5.2"
tower-http = "0.6.8"
helpers = "0.6.1"
ureq = "3.2.0"
url = "2.5.8"
pulldown-cmark = "0.13.1"
async-openai = "0.33.0"

[dependencies]
tower-http = { workspace = true, features = ["trace", "cors"] }
migration.workspace = true
dotenvy.workspace = true
envy.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "local-time",
] }
sea-orm.workspace = true
axum = { workspace = true, features = ["macros"] }
serde_json.workspace = true
thiserror.workspace = true
helpers = { workspace = true, features = ["hash", "jwt", "time", "uuid"] }
tower.workspace = true
ureq.workspace = true
url.workspace = true
pulldown-cmark.workspace = true
async-openai = { workspace = true, features = ["full"] }

[build-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "local-time",
] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { workspace = true, features = ["util"] }

[features]
default = ["sqlite"]
sqlite = ["migration/sqlite"]
mysql = ["migration/mysql"]
postgres = ["migration/postgres"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[package.metadata.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          ({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
{%- if github -%}
{% if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## ❤️ New Contributors
{% endif %}\
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor -%}
{%- endif %}

"""
footer = """
"""
trim = true
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/orhun/git-cliff" }, # replace repository URL
]
